name: Build and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built image to the Droplet
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Droplet
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DROPLET_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" "$DROPLET_USER@$DROPLET_HOST" \
            "mkdir -p /tmp/languagerecap-migrations"
          scp -i "$HOME/.ssh/deploy_key" \
            deploy-production.sh docker-compose.production.yml lib/schema.sql \
            "$DROPLET_USER@$DROPLET_HOST:/tmp/"
          scp -i "$HOME/.ssh/deploy_key" -r migrations/. \
            "$DROPLET_USER@$DROPLET_HOST:/tmp/languagerecap-migrations/"
          ssh -i "$HOME/.ssh/deploy_key" "$DROPLET_USER@$DROPLET_HOST" \
            "sudo install -d -m 755 /opt/languagerecap/lib /opt/languagerecap/migrations && \
             sudo install -m 755 /tmp/deploy-production.sh /opt/languagerecap/deploy-production.sh && \
             sudo install -m 644 /tmp/docker-compose.production.yml /opt/languagerecap/docker-compose.production.yml && \
             sudo install -m 644 /tmp/schema.sql /opt/languagerecap/lib/schema.sql && \
             sudo cp -a /tmp/languagerecap-migrations/. /opt/languagerecap/migrations/ && \
             sudo /opt/languagerecap/deploy-production.sh '$IMAGE_REFERENCE'"
